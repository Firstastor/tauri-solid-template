[package]
name = "template"
version = "1.0.0"
edition = "2024"

[lib]
name = "template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"

[profile.dev]
codegen-units = 256
opt-level = 1

[profile.release]
codegen-units = 1
lto = true 
opt-level = "s"
panic = "abort" 
strip = true
